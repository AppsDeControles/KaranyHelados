<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paletería</title>
<meta name="theme-color" content="#C8076A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --hielo:#EDF7F6; --papel:#FFFFFF; --tinta:#25163F; --tinta2:#5B4E73; --linea:#D3E3E2;
  --rosa:#C8076A; --rosa-osc:#9E0553; --rosa-claro:#FBE6F1; --mango:#FFB81C; --menta:#0B7F73;
  --alerta:#B3261E; --alerta-claro:#FCEAE8; --palo:#E3C08F;
  --rotulo:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --texto:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--hielo);color:var(--tinta);font:400 16px/1.45 var(--texto);-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--rotulo);font-weight:400;line-height:1.1;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
[hidden]{display:none!important}
.chico{font-size:14px;color:var(--tinta2)}
.alerta-txt{color:var(--alerta);font-weight:600}

/* Botones */
.btn{border:0;border-radius:999px;padding:12px 20px;min-height:46px;font-weight:600;background:var(--papel);box-shadow:inset 0 0 0 1.5px var(--tinta);color:var(--tinta)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--rosa);color:#fff;box-shadow:none}
.btn.pri:hover{background:var(--rosa-osc)}
.btn.peligro{box-shadow:inset 0 0 0 1.5px var(--alerta);color:var(--alerta)}
.btn.mini{min-height:38px;padding:7px 14px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ancho{width:100%}
.link{background:none;border:0;padding:6px 2px;color:var(--rosa-osc);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Formularios */
label.campo{display:block;margin-bottom:14px;font-weight:600;font-size:14px}
label.campo small{font-weight:400;color:var(--tinta2);display:block}
input.ent,select.ent,textarea.ent{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1.5px solid #A9BFBE;border-radius:10px;background:#fff;font-weight:400;font-size:16px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{background:var(--alerta-claro);color:var(--alerta);padding:10px 12px;border-radius:10px;margin-bottom:12px;font-weight:600;font-size:14px}
.pista{background:var(--hielo);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}

/* Pantallas de acceso */
.acceso{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--rosa)}
.acceso-caja{width:100%;max-width:400px;background:var(--papel);border-radius:22px;padding:26px 22px}
.acceso-caja h1{font-size:34px;color:var(--rosa);margin-bottom:6px}
.acceso-caja>p{margin-bottom:18px;color:var(--tinta2)}

/* Estructura */
.app{height:100%;display:grid;grid-template-rows:1fr auto}
.principal{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.nav{display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--papel);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--tinta2)}
.nav button[aria-current=page]{color:var(--rosa)}
.nav svg{width:24px;height:24px}
.barra{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.barra h1{font-size:23px;flex:1;min-width:0;overflow-wrap:anywhere}
.estado{border:0;background:#D8EFEB;color:#085F56;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.estado.pend{background:#FFEFC7;color:#6B4A00}
.estado.mal{background:var(--alerta-claro);color:var(--alerta)}
.aviso{margin:0 16px 10px;padding:10px 12px;background:var(--alerta-claro);color:var(--alerta);border-radius:10px;font-size:14px;font-weight:600}
.seccion{padding:0 16px 28px;max-width:860px}
.pestanas{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.pestanas::-webkit-scrollbar{display:none}
.pest{flex:none;border:0;border-radius:999px;padding:8px 15px;background:transparent;box-shadow:inset 0 0 0 1.5px #A9BFBE;font-weight:600;font-size:14.5px;min-height:38px}
.pest[aria-pressed=true]{background:var(--tinta);color:#fff;box-shadow:none}

/* Caja: paletas y vasos */
.caja{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto 1fr auto;height:100%;min-height:0}
.caja-prod{overflow-y:auto;min-height:0;padding:6px 14px 18px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:14px 10px}
.tile{position:relative;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--t)}
.tile .cuerpo{width:100%;min-height:108px;background:var(--c);padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:inset 0 0 0 1px rgba(37,22,63,.14)}
.tile.paleta .cuerpo{border-radius:44px 44px 12px 12px}
.tile.paleta .palo{width:15px;height:17px;background:var(--palo);border-radius:0 0 8px 8px}
.tile.vaso{padding-top:6px}
.tile.vaso .cuerpo{border-radius:6px 6px 22px 22px;clip-path:polygon(0 0,100% 0,89% 100%,11% 100%);padding-inline:14%;min-height:119px}
.tile.vaso::before{content:"";position:absolute;top:0;left:-1px;right:-1px;height:9px;border-radius:6px;background:rgba(37,22,63,.72)}
.tile .nom{font-weight:700;font-size:14.5px;line-height:1.15;overflow-wrap:anywhere}
.tile .pre{font-family:var(--rotulo);font-size:21px;line-height:1.2}
.tile .qued{font-size:12px;font-weight:500;line-height:1.15}
.tile.agotado .cuerpo{filter:saturate(.3);opacity:.82}
.tile:active .cuerpo{transform:scale(.96)}
.tile .marca{position:absolute;text-align:center;top:-4px;right:0;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--tinta);color:#fff;font-weight:700;font-size:15px;line-height:28px;box-shadow:0 0 0 2px var(--hielo)}
.vacio{padding:30px 18px;text-align:center;color:var(--tinta2)}
.vacio h2{color:var(--tinta);font-size:22px;margin-bottom:8px}
.vacio .btn{margin-top:14px}
.buscar{margin:0 16px 8px}
.cobro{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--papel);border-top:1px solid var(--linea)}
.cobro .resumen{flex:1;min-width:0;line-height:1.15}
.cobro .total{font-family:var(--rotulo);font-size:25px}
.cobro .btn{padding-inline:26px}
.carrito{display:none}

/* Diálogos */
dialog{border:0;padding:0;background:var(--papel);color:var(--tinta);width:100%;max-width:520px;max-height:92dvh;border-radius:22px 22px 0 0;margin:auto auto 0;overscroll-behavior:contain}
dialog::backdrop{background:rgba(37,22,63,.55)}
.dlg{padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.dlg-cab{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.dlg-cab h2{flex:1;font-size:24px}
.cerrar{border:0;background:var(--hielo);width:40px;height:40px;border-radius:50%;font-size:20px;line-height:1;flex:none}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.acciones .btn{flex:1 1 130px}
.lin{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linea)}
.lin .nomb{font-weight:600;line-height:1.2}
.cant{display:flex;align-items:center;gap:2px}
.cant button{width:38px;height:38px;border:0;border-radius:50%;background:var(--hielo);font-size:20px;font-weight:700}
.cant span{min-width:26px;text-align:center;font-weight:700}
.lin .imp{min-width:62px;text-align:right;font-weight:700}
.pagar-total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 14px}
.pagar-total b{font:400 38px/1 var(--rotulo)}
.exacto{width:100%;font-size:18px;min-height:56px;margin-bottom:10px}
.billetes{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-bottom:10px}
.metodos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cambio{text-align:center;padding:12px 0 18px}
.cambio b{display:block;font:400 62px/1.05 var(--rotulo);color:var(--rosa)}
.color-op{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.color-op label{position:relative;width:36px;height:36px}
.color-op input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
.color-op span{display:block;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(37,22,63,.2)}
.color-op input:checked+span{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--tinta)}
.color-op input:focus-visible+span{outline:3px solid var(--mango);outline-offset:4px}
.seg{display:flex;gap:6px;margin:6px 0 14px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
.seg span{display:block;text-align:center;padding:10px 6px;border-radius:10px;box-shadow:inset 0 0 0 1.5px #A9BFBE;font-weight:600;font-size:14.5px}
.seg input:checked+span{background:var(--tinta);color:#fff;box-shadow:none}
.seg input:focus-visible+span{outline:3px solid var(--mango);outline-offset:2px}
.cons{display:grid;grid-template-columns:1fr 84px 40px;gap:8px;align-items:center;margin-bottom:8px}
.cons .ent{margin:0}

/* Inventario */
.renglon{display:grid;grid-template-columns:14px 1fr auto;gap:4px 10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--linea)}
.punto{width:14px;height:22px;border-radius:7px 7px 3px 3px;box-shadow:inset 0 0 0 1px rgba(37,22,63,.2)}
.renglon .n{font-weight:600;line-height:1.2}
.renglon .x{font:400 24px/1 var(--rotulo);text-align:right;white-space:nowrap}
.renglon .x small{font:500 13px var(--texto);color:var(--tinta2)}
.renglon .ops{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bajo{display:inline-block;background:var(--alerta-claro);color:var(--alerta);border-radius:6px;padding:1px 7px;font-size:12.5px;font-weight:700;margin-left:4px}
.tit-sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 6px}
.tit-sec h2{font-size:21px}
.mov{padding:9px 0;border-bottom:1px solid var(--linea);font-size:14.5px}

/* Reportes */
.periodo{display:flex;align-items:center;gap:6px;padding:0 16px 6px}
.periodo .flecha{width:42px;height:42px;border:0;border-radius:50%;background:var(--papel);font-size:21px;font-weight:700;box-shadow:inset 0 0 0 1px var(--linea)}
.periodo .flecha[disabled]{opacity:.35}
.periodo b{flex:1;text-align:center;font-weight:700}
.heroe{padding:10px 0 14px}
.heroe .monto{font:400 clamp(46px,13vw,76px)/1 var(--rotulo);color:var(--rosa);overflow-wrap:anywhere}
.heroe .comp{margin-top:6px;font-weight:600}
.datos3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 18px;padding:12px 0;border-block:1px solid var(--linea);margin-bottom:18px}
.datos3 b{display:block;font:400 25px/1.1 var(--rotulo)}
.datos3 span{font-size:13.5px;color:var(--tinta2)}
.grafica{margin-bottom:22px}
.lectura{min-height:24px;font-size:14.5px;font-weight:600;margin-bottom:4px}
.barras{display:flex;align-items:flex-end;gap:2px;height:130px;border-bottom:1px solid #A9BFBE}
.barras button{flex:1;min-width:0;height:100%;border:0;background:none;padding:0;display:flex;align-items:flex-end}
.barras i{display:block;width:100%;background:var(--rosa);border-radius:4px 4px 0 0}
.barras button:hover i,.barras button:focus-visible i,.barras button.sel i{background:var(--tinta)}
.ejes{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tinta2);padding-top:4px}
.ranking{margin-bottom:26px}
.rk{display:block;width:100%;border:0;background:none;text-align:left;padding:11px 0 9px;border-bottom:1px solid var(--linea);color:inherit}
.rk-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rk-top .nm{font-weight:700;min-width:0}
.rk-top .mt{font:400 21px/1.1 var(--rotulo);white-space:nowrap}
.pal-h{display:flex;align-items:center;margin:6px 0 5px;height:17px}
.pal-h .st{flex:none;width:17px;height:7px;background:var(--palo);border-radius:4px 0 0 4px}
.pal-h .bd{height:17px;min-width:6px;border-radius:0 9px 9px 0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(37,22,63,.2)}
.rk-det{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;background:var(--hielo);border-radius:10px;margin:5px 0 3px}
.rk-det b{display:block;font-size:15px}
.rk-det span{font-size:12.5px;color:var(--tinta2);display:block;line-height:1.25}
.agua{padding:12px 0;border-bottom:1px solid var(--linea)}
.agua h3{font:700 16px var(--texto);margin-bottom:7px}
.agua dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px 12px}
.agua dt{font-size:12.5px;color:var(--tinta2)}
.agua dd{margin:0;font-weight:700}

/* Venta en lista y fotos */
.lista-venta{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 18px}
.fila-venta{position:relative;display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;width:100%;min-height:62px;border:0;border-bottom:1px solid var(--linea);background:none;padding:8px 2px;text-align:left}
.fila-venta .mini{width:44px;height:44px;border-radius:22px 22px 8px 8px;background:var(--c) center/cover;box-shadow:inset 0 0 0 1px rgba(37,22,63,.16)}
.fila-venta .nom{font-weight:700;line-height:1.2;display:block}
.fila-venta .qued{font-size:13px;color:var(--tinta2)}
.fila-venta .pre{font:400 21px var(--rotulo)}
.fila-venta .marca{min-width:26px;height:26px;border-radius:13px;background:var(--tinta);color:#fff;font-weight:700;font-size:14px;line-height:26px;text-align:center;padding:0 5px}
.fila-venta.agotado .nom,.fila-venta.agotado .pre{color:var(--tinta2)}
.fila-venta:active{background:var(--rosa-claro)}
.tile.con-foto .cuerpo{padding:0;justify-content:flex-end;background:var(--c) center/cover;overflow:hidden;min-height:156px}
.tile.con-foto .scrim span{display:block}
.tile.con-foto .scrim{display:block;width:100%;background:rgba(37,22,63,.76);color:#fff;padding:4px 5px 6px}
.tile.vaso.con-foto .scrim{padding-inline:14%}
.tile.con-foto .pre{font-size:18px}
.foto-campo{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.foto-campo .muestra{width:64px;height:64px;flex:none;border-radius:12px;background:var(--hielo) center/contain no-repeat;box-shadow:inset 0 0 0 1px var(--linea)}
/* Turno */
.turno-bar{display:flex;align-items:center;gap:10px;margin:0 16px 8px;padding:8px 8px 8px 14px;background:var(--papel);border-radius:14px;box-shadow:inset 0 0 0 1px var(--linea);font-size:14px;line-height:1.25}
.turno-bar>div{flex:1;min-width:0}
.turno-bar b{display:block}
.persona{padding:11px 0;border-bottom:1px solid var(--linea)}
.persona-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.persona-top b{font-weight:700}
.horas3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:5px}
.horas3 span{display:block;font-size:12.5px;color:var(--tinta2)}
.horas3 b{font:400 21px/1.15 var(--rotulo)}
.etq{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12.5px;font-weight:700;background:var(--hielo);color:var(--tinta2)}
.etq.mal{background:var(--alerta-claro);color:var(--alerta)}
.etq.ok{background:#D8EFEB;color:#085F56}
.etq.pend{background:#FFEFC7;color:#6B4A00}
.resumen-p{display:block;width:100%;border:0;background:none;padding:11px 0;text-align:left;border-bottom:1px solid var(--linea)}
.resumen-p dl{margin:6px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:6px 10px}
.resumen-p dt{font-size:12.5px;color:var(--tinta2)}
.resumen-p dd{margin:0;font-weight:700}
.dia-fila{display:grid;grid-template-columns:minmax(92px,1.2fr) 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linea);font-size:14px}
.dias-sel{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 14px}
.dias-sel label{position:relative}
.dias-sel input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
.dias-sel span{display:block;min-width:40px;text-align:center;padding:8px 4px;border-radius:9px;box-shadow:inset 0 0 0 1.5px #A9BFBE;font-weight:600;font-size:14px}
.dias-sel input:checked+span{background:var(--tinta);color:#fff;box-shadow:none}
.dias-sel input:focus-visible+span{outline:3px solid var(--mango);outline-offset:2px}
.check{display:flex;gap:9px;align-items:center;padding:7px 0;font-weight:500}
.check input{width:20px;height:20px;flex:none;accent-color:var(--rosa)}
/* Configuración del ticket */
.cfg-ticket{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.papel-env{background:#DDE9E8;border-radius:14px;padding:16px;display:flex;justify-content:center;overflow:hidden}
.papel{background:#fff;color:#000;padding:12px 8px 18px;font-family:'Courier New',Courier,monospace;line-height:1.3;box-shadow:0 1px 5px rgba(37,22,63,.25);flex:none}
.papel img{display:block;margin:0 auto 6px;height:auto}
.papel pre{margin:0;font:inherit;white-space:pre;overflow:hidden}
.papel.grande pre div{transform:scaleY(1.9);transform-origin:top;height:2.47em}
.formato-op{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.formato-op label{position:relative}
.formato-op input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
.formato-op .caj{display:block;padding:12px;border-radius:12px;box-shadow:inset 0 0 0 1.5px #A9BFBE;font-weight:600;font-size:14.5px;text-align:center}
.formato-op input:checked+.caj{box-shadow:inset 0 0 0 3px var(--rosa)}
.formato-op input:focus-visible+.caj{outline:3px solid var(--mango);outline-offset:2px}
.formato-op svg{display:block;width:100%;height:58px;margin-bottom:6px}

/* Vacaciones */
.vac{background:var(--papel);border-radius:14px;box-shadow:inset 0 0 0 1px var(--linea);padding:14px;margin:10px 0 12px}
.vac h3{font-size:19px;margin-bottom:8px}
.vac-saldo{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.vac-saldo b{font:400 44px/1 var(--rotulo);color:var(--rosa)}
.vac-saldo b.neg{color:var(--alerta)}
.vac dl{margin:0 0 10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px 12px}
.vac dt{font-size:12.5px;color:var(--tinta2)}
.vac dd{margin:0;font-weight:700}
.vac-sig{background:var(--hielo);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14.5px}
.vac-sig b{display:block}
.vac .acciones .btn{flex:1 1 150px}
.vac-per{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--linea);font-size:14px}

#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--tinta);color:#fff;border-radius:14px;padding:11px 16px;display:flex;align-items:center;gap:14px;z-index:50;font-weight:600;font-size:15px}
#toast button{background:none;border:0;color:var(--mango);font-weight:700;padding:4px;white-space:nowrap}
#ticket{display:none}

@media (min-width:600px){
  dialog{margin:auto;border-radius:22px}
}
@media (min-width:900px){
  .app{grid-template-rows:1fr;grid-template-columns:92px 1fr}
  .nav{order:-1;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;padding-top:14px;border-top:0;border-right:1px solid var(--linea)}
  .nav button{padding:12px 2px}
  .caja{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto auto 1fr}
  .caja>.barra,.caja>.aviso-envoltura,.caja>.buscar-env,.caja>.pestanas,.caja>.caja-prod{grid-column:1}
  .cobro{display:none}
  .carrito{display:flex;flex-direction:column;grid-column:2;grid-row:1/-1;background:var(--papel);border-left:1px solid var(--linea);padding:18px 16px;min-height:0}
  .carrito h2{font-size:22px;margin-bottom:6px}
  .carrito .lista{flex:1;overflow-y:auto;min-height:0}
  .carrito .pagar-total{margin-bottom:10px}
  .rejilla{grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:18px 14px}
  .seccion{padding-inline:24px}
  .cfg-ticket{grid-template-columns:minmax(0,1fr) minmax(320px,380px);align-items:start}
  .papel-env{position:sticky;top:8px}
  .turno-bar{margin-inline:24px}
  .barra{padding-inline:24px}
  .pestanas,.periodo{padding-inline:24px}
}
@media print{
  body *{visibility:hidden}
  dialog::backdrop{display:none}
  #ticket,#ticket *{visibility:visible}
  #ticket{display:block;position:absolute;left:0;top:0;color:#000}
  #ticket .papel{box-shadow:none;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="raiz" style="height:100%"></div>
<dialog id="dlg" aria-labelledby="dlg-titulo"></dialog>
<div id="toast" role="status" hidden></div>
<div id="ticket"></div>
<script>
'use strict';
/* Pega aquí la URL del servidor de Apps Script (termina en /exec).
   Si la dejas vacía, la app la pedirá la primera vez en cada dispositivo. */
const API_URL = '';
const VERSION_APP = '1.2.0';

/* ========== Utilidades ========== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dinero = (n) => {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return '$' + v.toLocaleString('es-MX', { minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits: 2 });
};
const dec = (n, d = 2) => (Math.round((Number(n) || 0) * 10 ** d) / 10 ** d).toLocaleString('es-MX', { maximumFractionDigits: d });
const litros = (n) => dec(n, 2) + ' L';
const pad = (n) => String(n).padStart(2, '0');
const diaStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const aDia = (s) => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d, 12); };
const sumarDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const plural = (n, s, p) => `${dec(n)} ${Number(n) === 1 ? s : (p || s + 's')}`;

const ls = {
  get(k, def = null) { try { const v = localStorage.getItem('pal_' + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('pal_' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem('pal_' + k); } catch (e) { /* sin acceso */ } }
};

/* ========== Estado ========== */
const S = {
  api: API_URL || ls.get('api', ''),
  sesion: ls.get('sesion'),
  datos: ls.get('datos'),
  cola: ls.get('cola', []),
  rechazados: ls.get('rechazados', []),
  vista: 'vender',
  categoria: 'Todos',
  busqueda: '',
  carrito: [],
  inv: 'productos',
  rep: { periodo: 'mes', ancla: new Date(), datos: null, orden: 'ventas', abierto: null, cargando: false, error: '', personaAbierta: null },
  enLinea: navigator.onLine,
  sincronizando: false,
  sesionVencida: false,
  ultimaSync: ls.get('ultimaSync'),
  ultimoError: ls.get('ultimoError', ''),
  bt: { dispositivo: null, canal: null },
  ancho: ls.get('anchoTicket', 32),
  autoImprimir: ls.get('autoImprimir', false),
  metodoImp: ls.get('metodoImp', 'sistema'),
  cfgTab: 'ticket',
  imgs: ls.get('imgs', {}),
  asis: ls.get('asis', {}),
  asisAbierto: null,
  fotoNueva: undefined,
  abrirUrl: (u) => { location.href = u; },
  instalar: null
};
const esSocia = () => S.sesion?.usuario?.rol === 'socia';

function anotarError(m) {
  S.ultimoError = `${new Date().toLocaleString('es-MX')}: ${m}`;
  ls.set('ultimoError', S.ultimoError);
}
window.addEventListener('error', (e) => { anotarError(e.message); aviso('Algo falló en la pantalla: ' + e.message); });
window.addEventListener('unhandledrejection', (e) => { const m = e.reason?.message || String(e.reason); anotarError(m); aviso(m); });

/* ========== Servidor ========== */
async function api(accion, datos = {}) {
  if (!S.api) throw new Error('Falta la dirección del servidor.');
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 45000);
  let res, json;
  try {
    res = await fetch(S.api, {
      method: 'POST', redirect: 'follow', signal: ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion, token: S.sesion?.token, ...datos })
    });
    json = await res.json();
  } catch (e) {
    const err = new Error('No hay conexión con el servidor.');
    err.red = true;
    throw err;
  } finally { clearTimeout(t); }
  if (!json.ok) {
    const err = new Error(json.error || 'El servidor no pudo completar la acción.');
    err.codigo = json.codigo;
    if (json.codigo === 'sesion') { S.sesionVencida = true; refrescarEstado(); }
    throw err;
  }
  return json;
}

function guardarDatos(d) {
  const uid_ = S.sesion?.usuario?.id;
  if (uid_ && d.miAsistencia) S.asis[uid_] = d.miAsistencia;
  delete d.miAsistencia;
  S.datos = d;
  aplicarPendientes();
  ls.set('asis', S.asis);
  if (!ls.set('datos', S.datos)) { ls.del('reporte'); ls.set('datos', S.datos); }
  sincImagenes();
}
let bajandoImgs = false;
async function sincImagenes() {
  if (bajandoImgs || !S.datos?.imagenes) return;
  const vers = S.datos.imagenes;
  let cambio = false;
  Object.keys(S.imgs).forEach((k) => { if (!vers[k]) { delete S.imgs[k]; cambio = true; } });
  const faltan = Object.keys(vers).filter((k) => S.imgs[k]?.v !== vers[k]);
  if (!faltan.length) { if (cambio) { ls.set('imgs', S.imgs); redibujarSiLibre(); } return; }
  bajandoImgs = true;
  try {
    for (let i = 0; i < faltan.length; i += 8) {
      const r = await api('imagenes', { ids: faltan.slice(i, i + 8) });
      r.imagenes.forEach((x) => { S.imgs[x.id] = { v: x.version, d: x.data }; });
    }
    ls.set('imgs', S.imgs);
    redibujarSiLibre();
  } catch (e) { if (!e.red) anotarError(e.message); } finally { bajandoImgs = false; }
}
const imgDe = (id) => S.imgs[id]?.d || '';

function aplicarOp(d, op) {
  if (op.tipo === 'asistencia') {
    const lista = S.asis[op.usuarioId] || (S.asis[op.usuarioId] = []);
    if (op.accion === 'entrada') {
      if (!lista.some((r) => r.id === op.id)) lista.push({ id: op.id, dia: op.dia, empleadoId: op.usuarioId, empleadoNombre: op.usuarioNombre, entrada: op.hora, salida: '', tsEntrada: op.ts, progEntrada: d.miTurno?.entrada || '', progSalida: d.miTurno?.salida || '' });
    } else {
      const r = lista.find((x) => x.id === op.registroId);
      if (r) r.salida = op.hora;
    }
    ls.set('asis', S.asis);
    return;
  }
  const P = (id) => d.productos.find((x) => x.id === id);
  const I = (id) => d.insumos.find((x) => x.id === id);
  const SB = (id) => d.sabores.find((x) => x.id === id);
  if (op.tipo === 'venta') {
    op.lineas.forEach((l) => {
      const p = P(l.productoId);
      if (!p) return;
      if (p.tipo === 'agua') { const s = SB(p.saborId); if (s) s.litros -= p.ml / 1000 * l.cantidad; }
      else p.existencia -= l.cantidad;
      (p.consumos || []).forEach((c) => { const i = I(c.i); if (i) i.existencia -= c.c * l.cantidad; });
    });
  } else if (op.tipo === 'mov') {
    const it = op.clase === 'producto' ? P(op.itemId) : op.clase === 'insumo' ? I(op.itemId) : SB(op.itemId);
    if (!it) return;
    const c = op.clase === 'sabor' ? 'litros' : 'existencia';
    if (op.accion === 'conteo') it[c] = op.cantidad;
    else if (op.accion === 'merma') it[c] -= op.cantidad;
    else it[c] += op.cantidad;
    if (esSocia() && op.costoUnit > 0) { if (op.clase === 'sabor') it.costoLitro = op.costoUnit; else it.costo = op.costoUnit; }
  }
}
function aplicarPendientes() {
  if (!S.datos) return;
  S.cola.forEach((op) => { if (op.tipo !== 'asistencia' || op.usuarioId === S.sesion?.usuario?.id) aplicarOp(S.datos, op); });
}

function encolar(op) {
  S.cola.push(op);
  if (!ls.set('cola', S.cola)) {
    ls.del('reporte');
    ls.del('imgs');
    if (!ls.set('cola', S.cola)) {
      S.cola.pop();
      throw new Error('La memoria del dispositivo está llena y no se pudo guardar. Conéctate para subir lo pendiente.');
    }
  }
  aplicarOp(S.datos, op);
  ls.set('datos', S.datos);
  refrescarEstado();
  sincronizar();
}

async function sincronizar() {
  if (S.sincronizando || !S.sesion || !S.api || S.sesionVencida) return;
  S.sincronizando = true;
  try {
    let vuelta = 0;
    do {
      const lote = S.cola.slice(0, 40);
      const r = await api('sincronizar', { ops: lote });
      const res = new Map(r.resultados.map((x) => [x.id, x]));
      const malos = lote.filter((o) => res.get(o.id) && !res.get(o.id).ok);
      if (malos.length) {
        malos.forEach((o) => S.rechazados.push({ op: o, error: res.get(o.id).error }));
        ls.set('rechazados', S.rechazados);
      }
      S.cola = S.cola.filter((o) => !res.has(o.id));
      ls.set('cola', S.cola);
      guardarDatos(r.datos);
      vuelta++;
    } while (S.cola.length && vuelta < 50);
    S.enLinea = true;
    S.ultimaSync = new Date().toISOString();
    ls.set('ultimaSync', S.ultimaSync);
    redibujarSiLibre();
  } catch (e) {
    if (e.red) S.enLinea = false;
    else if (e.codigo !== 'sesion') anotarError(e.message);
  } finally {
    S.sincronizando = false;
    refrescarEstado();
  }
}

function redibujarSiLibre() {
  if ($('#dlg').open) { refrescarEstado(); return; }
  if (S.vista === 'vender') { dibujarProductos(); const b = $('#turno-slot'); if (b) b.innerHTML = htmlTurnoBar(); }
  else if (S.vista === 'inventario') dibujar();
}

/* ========== Mensajes ========== */
let toastT;
function aviso(msg, accion, fn, ms = 4000) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${accion ? `<button id="toast-a">${esc(accion)}</button>` : ''}`;
  t.hidden = false;
  const d = $('#dlg');
  (d.open ? d : document.body).appendChild(t);
  if (accion) $('#toast-a').onclick = () => { t.hidden = true; fn(); };
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; }, ms);
}

function rescatarToast() { const t = $('#toast'); if (t.parentElement !== document.body) document.body.appendChild(t); }
function abrirDlg(html) {
  const d = $('#dlg');
  rescatarToast();
  d.innerHTML = `<div class="dlg">${html}</div>`;
  if (!d.open) d.showModal();
}
function cerrarDlg() { const d = $('#dlg'); rescatarToast(); if (d.open) d.close(); d.innerHTML = ''; }
const cabDlg = (t) => `<div class="dlg-cab"><h2 id="dlg-titulo">${esc(t)}</h2><button type="button" class="cerrar" data-a="cerrar" aria-label="Cerrar">×</button></div>`;
$('#dlg').addEventListener('click', (e) => { if (e.target.id === 'dlg') cerrarDlg(); });

/* ========== Dibujo general ========== */
const ICONOS = {
  vender: '<path d="M8 3a4 4 0 0 1 8 0v0a4 4 0 0 1 0 0v12H8Z" transform="translate(0 1)" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 16v6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
  inventario: '<path d="M3 8l9-5 9 5v9l-9 5-9-5Z M3 8l9 5 9-5 M12 13v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  reportes: '<path d="M4 21V11M12 21V4M20 21v-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
  config: '<path d="M4 7h9M18 7h2M4 17h2M11 17h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15.500" cy="7" r="2.500" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.500" cy="17" r="2.500" fill="none" stroke="currentColor" stroke-width="2"/>',
  ajustes: '<circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1.2-4.4 4.3-6 8-6s6.800 1.600 8 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
};
function dibujar() {
  const raiz = $('#raiz');
  if (!S.api) return pantallaServidor();
  if (!S.sesion) return pantallaEntrada();
  const items = [['vender', 'Vender'], ['inventario', 'Inventario']];
  if (esSocia()) items.push(['reportes', 'Tablero']);
  items.push(['ajustes', esSocia() ? 'Configuración' : 'Cuenta']);
  if (!$('.app', raiz)) {
    raiz.innerHTML = `<div class="app"><main class="principal" id="principal"></main>
      <nav class="nav" style="--n:${items.length}" aria-label="Secciones">${items.map(([k, t]) => `<button data-a="ir" data-v="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONOS[k === 'ajustes' && esSocia() ? 'config' : k]}</svg>${t}</button>`).join('')}</nav></div>`;
  }
  $$('.nav button').forEach((b) => { if (b.dataset.v === S.vista) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const p = $('#principal');
  if (S.vista === 'vender') vistaVender(p);
  else if (S.vista === 'inventario') vistaInventario(p);
  else if (S.vista === 'reportes') vistaReportes(p);
  else vistaAjustes(p);
}
function barra(titulo, extra = '') {
  return `<div class="barra"><h1>${esc(titulo)}</h1>${extra}<span id="estado-slot">${htmlEstado()}</span></div>${htmlAvisos()}`;
}
function htmlEstado() {
  const n = S.cola.length;
  if (S.sesionVencida) return `<button class="estado mal" data-a="salir">Entra de nuevo</button>`;
  if (!S.enLinea) return `<button class="estado pend" data-a="estado-info">Sin conexión${n ? `, ${n} por subir` : ''}</button>`;
  if (n) return `<button class="estado pend" data-a="estado-info">${n} por subir</button>`;
  return `<button class="estado" data-a="estado-info">Al día</button>`;
}
function htmlAvisos() {
  const a = [];
  if (S.sesionVencida && S.cola.length) a.push(`Tu sesión terminó. Entra de nuevo para subir ${S.cola.length} ${S.cola.length === 1 ? 'registro pendiente' : 'registros pendientes'}; siguen guardados aquí.`);
  if (S.rechazados.length) a.push(`${S.rechazados.length} ${S.rechazados.length === 1 ? 'registro no se pudo guardar' : 'registros no se pudieron guardar'}. Revísalos en Cuenta.`);
  return a.map((x) => `<div class="aviso">${esc(x)}</div>`).join('');
}
function refrescarEstado() { const s = $('#estado-slot'); if (s) s.innerHTML = htmlEstado(); }

/* ========== Acceso ========== */
function pantallaServidor(err = '') {
  $('#raiz').innerHTML = `<div class="acceso"><div class="acceso-caja">
    <h1>Conecta tu paletería</h1>
    <p>Pega el enlace que te dio Apps Script al publicar el servidor. Termina en /exec.</p>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <form data-f="servidor"><label class="campo">Enlace del servidor<input class="ent" name="url" type="url" required placeholder="https://script.google.com/macros/s/…/exec"></label>
    <button class="btn pri ancho">Conectar</button></form></div></div>`;
}
async function pantallaEntrada(err = '') {
  let est = ls.get('estadoServidor');
  $('#raiz').innerHTML = htmlEntrada(est, err);
  if (est?.instalado) return;
  try {
    est = await api('estado');
    ls.set('estadoServidor', { instalado: est.instalado, negocio: est.negocio });
    if (!S.sesion) $('#raiz').innerHTML = htmlEntrada(est, err);
  } catch (e) { if (!e.red) anotarError(e.message); }
}
function htmlEntrada(est, err) {
  if (est && !est.instalado) {
    return `<div class="acceso"><div class="acceso-caja"><h1>Primera cuenta</h1>
    <p>Crea la cuenta de la primera socia. La otra socia y las empleadas se agregan desde adentro.</p>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <form data-f="instalar"><label class="campo">Nombre de la paletería<input class="ent" name="negocio" required maxlength="60"></label>
    <label class="campo">Tu nombre<input class="ent" name="nombre" required maxlength="60" autocomplete="name"></label>
    <label class="campo">Usuario <small>Sin espacios ni acentos, por ejemplo: maria</small><input class="ent" name="usuario" required autocapitalize="none" autocomplete="username"></label>
    <label class="campo">PIN <small>De 4 a 8 números</small><input class="ent" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" required autocomplete="new-password"></label>
    <button class="btn pri ancho">Crear cuenta</button></form></div></div>`;
  }
  return `<div class="acceso"><div class="acceso-caja"><h1>${esc(est?.negocio || S.datos?.negocio || 'Paletería')}</h1><p>Entra con tu usuario y PIN.</p>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <form data-f="entrar"><label class="campo">Usuario<input class="ent" name="usuario" required autocapitalize="none" autocomplete="username"></label>
    <label class="campo">PIN<input class="ent" name="pin" type="password" inputmode="numeric" required autocomplete="current-password"></label>
    <button class="btn pri ancho">Entrar</button></form>
    <p class="chico" style="margin-top:14px">${S.cola.length ? `Este dispositivo tiene ${S.cola.length} por subir. Se suben al entrar.` : ''}</p>
    </div></div>`;
}
async function hashLocal(pin, salt) {
  let v = new TextEncoder().encode(pin + '|' + salt);
  for (let i = 0; i < 1000; i++) v = new Uint8Array(await crypto.subtle.digest('SHA-256', v));
  return [...v].map((b) => b.toString(16).padStart(2, '0')).join('');
}
async function recordarLocal(usuario, pin, token, u) {
  const locales = ls.get('locales', {});
  const salt = uid('');
  locales[usuario] = { salt, hash: await hashLocal(pin, salt), token, usuario: u };
  ls.set('locales', locales);
}
async function entrarCon(respuesta, usuario, pin) {
  const anterior = ls.get('rolAnterior');
  S.sesion = { token: respuesta.token, usuario: respuesta.usuario };
  S.sesionVencida = false;
  ls.set('sesion', S.sesion);
  ls.set('rolAnterior', respuesta.usuario.rol);
  ls.set('estadoServidor', { instalado: true, negocio: respuesta.datos?.negocio || '' });
  if (respuesta.datos) guardarDatos(respuesta.datos);
  await recordarLocal(usuario, pin, respuesta.token, respuesta.usuario);
  S.vista = 'vender';
  S.rep.datos = null;
  $('#raiz').innerHTML = '';
  dibujar();
  sincronizar();
  return anterior;
}
function limpiarDatosSensibles() {
  ls.del('reporte');
  S.rep.datos = null;
  if (S.datos) {
    S.datos.productos?.forEach((p) => delete p.costo);
    S.datos.insumos?.forEach((i) => delete i.costo);
    S.datos.sabores?.forEach((s) => delete s.costoLitro);
    delete S.datos.usuarios;
    delete S.datos.turnos;
    delete S.datos.vacaciones;
    delete S.datos.miTurno;
    ls.set('datos', S.datos);
  }
}

/* ========== Vender ========== */
function productosVenta() { return (S.datos?.productos || []).filter((p) => p.activo); }
function luminancia(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return 1;
  const n = parseInt(m[1], 16);

/* ========== Reportes ========== */
function rangoDe(periodo, ancla) {
  const a = new Date(ancla);
  if (periodo === 'dia') return [diaStr(a), diaStr(a)];
  if (periodo === 'semana') {
    const lun = sumarDias(a, -((a.getDay() + 6) % 7));
    return [diaStr(lun), diaStr(sumarDias(lun, 6))];
  }
  if (periodo === 'mes') return [diaStr(new Date(a.getFullYear(), a.getMonth(), 1, 12)), diaStr(new Date(a.getFullYear(), a.getMonth() + 1, 0, 12))];
  return [`${a.getFullYear()}-01-01`, `${a.getFullYear()}-12-31`];
}
function moverAncla(periodo, ancla, d) {
  const a = new Date(ancla);
  if (periodo === 'dia') return sumarDias(a, d);
  if (periodo === 'semana') return sumarDias(a, 7 * d);
  if (periodo === 'mes') return new Date(a.getFullYear(), a.getMonth() + d, 1, 12);
  return new Date(a.getFullYear() + d, 0, 1, 12);
}
function nombrePeriodo(periodo, ancla) {
  const a = new Date(ancla);
  const hoy = diaStr(new Date());
  if (periodo === 'dia') {
    const s = diaStr(a);
    const base = `${DIAS[a.getDay()]} ${a.getDate()} de ${MESES[a.getMonth()]}`;
    return s === hoy ? `Hoy, ${base}` : base[0].toUpperCase() + base.slice(1);
  }
  if (periodo === 'semana') {
    const [i, f] = rangoDe('semana', a).map(aDia);
    return `Semana del ${i.getDate()} de ${MESES[i.getMonth()]} al ${f.getDate()} de ${MESES[f.getMonth()]}`;
  }
  if (periodo === 'mes') return `${MESES[a.getMonth()][0].toUpperCase()}${MESES[a.getMonth()].slice(1)} de ${a.getFullYear()}`;
  return String(a.getFullYear());
}
function comparacion(periodo, ancla) {
  const [d1, d2] = rangoDe(periodo, ancla);
  const hoy = diaStr(new Date());
  const prevAncla = moverAncla(periodo, ancla, -1);
  let [p1, p2] = rangoDe(periodo, prevAncla);
  const enCurso = hoy >= d1 && hoy <= d2 && periodo !== 'dia';
  if (enCurso) {
    const trans = Math.round((aDia(hoy) - aDia(d1)) / 864e5);
    const tope = diaStr(sumarDias(aDia(p1), trans));
    if (tope < p2) p2 = tope;
  }
  const a = new Date(prevAncla);
  const base = periodo === 'dia' ? 'el día anterior' : periodo === 'semana' ? 'la semana anterior' : periodo === 'mes' ? MESES[a.getMonth()] : String(a.getFullYear());
  const etiqueta = enCurso ? `a esta altura de ${base}` : base;
  return { p1, p2, etiqueta };
}
function agregar(filas, d1, d2) {
  const m = {};
  filas.forEach(([dia, pid, cant, imp, costo, conCosto, lt]) => {
    if (dia < d1 || dia > d2) return;
    const o = m[pid] || (m[pid] = { id: pid, cant: 0, imp: 0, costo: 0, conCosto: 0, lt: 0 });
    o.cant += cant; o.imp += imp; o.costo += costo; o.conCosto += conCosto; o.lt += lt;
  });
  return m;
}
function sumaTickets(tk, d1, d2) {
  const r = { n: 0, imp: 0, metodos: {} };
  tk.forEach(([dia, met, n, imp]) => {
    if (dia < d1 || dia > d2) return;
    r.n += n; r.imp += imp;
    r.metodos[met] = (r.metodos[met] || 0) + imp;
  });
  return r;
}
async function cargarReporte() {
  const y = new Date(S.rep.ancla).getFullYear();
  const cl = `${y}`;
  if (S.rep.datos?.clave === cl && S.rep.datos.fresco && Date.now() - S.rep.datos.fresco < 60000) return;
  if (!S.rep.datos || S.rep.datos.clave !== cl) {
    const g = ls.get('reporte');
    S.rep.datos = g?.clave === cl ? g : null;
  }
  S.rep.cargando = true; S.rep.error = '';
  dibujar();
  try {
    await sincronizar();
    const r = await api('reporte', { desde: `${y - 1}-01-01`, hasta: `${y}-12-31` });
    S.rep.datos = { clave: cl, fresco: Date.now(), filas: r.filas, tickets: r.tickets, agua: r.agua, nombres: r.nombres, asistencia: r.asistencia || [] };
    ls.set('reporte', S.rep.datos);
  } catch (e) {
    S.rep.error = e.red ? 'Sin conexión. Los números son de la última vez que se cargaron.' : e.message;
  }
  S.rep.cargando = false;
  if (S.vista === 'reportes') dibujar();
}
function vistaReportes(p) {
  const R = S.rep;

  const hoy = diaStr(new Date());
  const puedeSig = d2 < hoy;
  const y = String(new Date(R.ancla).getFullYear());
  if (!R.cargando && (R.datos?.clave !== y || !R.datos?.fresco) && !R.error) { setTimeout(cargarReporte, 0); }

  const D = R.datos?.clave === y ? R.datos : null;

function htmlReporte(D, d1, d2) {
  const R = S.rep;
  const t = sumaTickets(D.tickets, d1, d2);
  const cmp = comparacion(R.periodo, R.ancla);

  const faltan = lista.filter((x) => x.imp - x.conCosto > 0.009);

  }

    <div class="heroe"><div class="monto">${dinero(t.imp)}</div><div class="comp">${esc(frase || 'Vendido en este periodo')}</div></div>
    <div class="datos3">
      <div><b>${dec(t.n)}</b><span>Ventas</span></div>
      <div><b>${dinero(t.n ? t.imp / t.n : 0)}</b><span>Promedio por venta</span></div>
      <div><b>${dinero(ganancia)}</b><span>Ganancia sobre el costo${faltan.length ? `, sin contar ${plural(faltan.length, 'producto')} sin costo` : ''}</span></div>
      ${Object.entries(metodos).filter(([m]) => t.metodos[m]).map(([m, n]) => `<div><b>${dinero(t.metodos[m])}</b><span>${n}</span></div>`).join('')}
    </div>
    ${htmlPersonalHoy(D, d1, d2)}

function htmlGrafica(D, d1, d2) {
  const R = S.rep;
  if (R.periodo === 'dia') return '';
  let cols = [];
  if (R.periodo === 'anio') {
    const y = d1.slice(0, 4);
    cols = MESES.map((m, i) => ({ d1: `${y}-${pad(i + 1)}-01`, d2: `${y}-${pad(i + 1)}-31`, et: m[0].toUpperCase() + m.slice(1), v: 0 }));
  } else {
    for (let d = aDia(d1); diaStr(d) <= d2; d = sumarDias(d, 1)) {
      const s = diaStr(d);
      cols.push({ d1: s, d2: s, et: `${DIAS[d.getDay()]} ${d.getDate()}`, v: 0 });
    }
  }
  D.tickets.forEach(([dia, , , imp]) => { const c = cols.find((x) => dia >= x.d1 && dia <= x.d2); if (c) c.v += imp; });
  const max = Math.max(...cols.map((c) => c.v), 1);
  const ini = R.periodo === 'anio' ? 'Ene' : String(aDia(d1).getDate());
  const fin = R.periodo === 'anio' ? 'Dic' : String(aDia(d2).getDate());
  const titulo = R.periodo === 'anio' ? 'Ventas por mes' : 'Ventas por día';
  return `<div class="grafica"><div class="tit-sec"><h2>${titulo}</h2><span class="chico">Máximo ${dinero(max)}</span></div>
    <div class="lectura" id="lectura">Toca una barra para ver el monto.</div>
    <div class="barras">${cols.map((c) => `<button data-a="barra" data-t="${esc(c.et)}: ${dinero(c.v)}" aria-label="${esc(c.et)}: ${dinero(c.v)}"><i style="height:${c.v ? Math.max(c.v / max * 100, 1.5) : 0}%"></i></button>`).join('')}</div>
    <div class="ejes"><span>${ini}</span><span>${fin}</span></div></div>`;
}
function htmlRanking(D, d1, d2, prodM) {
  const R = S.rep;
  const info = (id) => S.datos.productos.find((p) => p.id === id);
  const gan = (x) => x.conCosto - x.costo;
  const lista = Object.values(prodM).sort((a, b) => (R.orden === 'ganancia' ? gan(b) - gan(a) : b.imp - a.imp));
  const max = Math.max(...lista.map((x) => (R.orden === 'ganancia' ? Math.max(gan(x), 0) : x.imp)), 1);
  const vendidos = new Set(lista.map((x) => x.id));

function actualizarFormVac(cambio) {
  const f = $('#f-vac');

  const desde = f.elements.desde.value;
  const hasta = f.elements.hasta.value;
  if (cambio && cambio !== 'dias' && !f.dataset.manual) {
    const n = diasDeVacacion(uid_, desde, hasta);
    f.elements.dias.value = n || '';
  }
  const aviso = $('#vac-aviso');
  const dias = Number(f.elements.dias.value || 0);
  const antes = f.dataset.id ? (vacDatos().periodos.find((x) => x.id === f.dataset.id)?.dias || 0) : 0;
  const { actual } = estadoVac(uid_);
  if (!actual || !dias) { aviso.textContent = ''; return; }

  aviso.innerHTML = queda < 0 ? `<span class="alerta-txt">Le quedarían ${dec(queda)} días: está tomando más de los que tiene.</span>` : `Le quedarían ${plural(queda, 'día')}.`;

const sinAcentos = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ñ/g, 'n').replace(/Ñ/g, 'N').replace(/[^\x20-\x7E]/g, '');

function columnasTicket(letra, ancho) {
  if (letra === 'chica') return ancho === 48 ? 64 : 42;
  return ancho === 48 ? 48 : 32;
}
function partir(t, w) {
  const out = [];
  String(t).split(/\r?\n/).forEach((reng) => {
    let actual = '';
    reng.trim().split(/\s+/).forEach((pal) => {
      while (pal.length > w) { if (actual) { out.push(actual); actual = ''; } out.push(pal.slice(0, w)); pal = pal.slice(w); }
      if ((actual + ' ' + pal).trim().length > w) { out.push(actual); actual = pal; } else actual = (actual + ' ' + pal).trim();
    });
    if (actual) out.push(actual);
  });
  return out;
}
function lineasTicket(v, c = confTicket()) {
  const w = columnasTicket(c.letra, S.ancho);

const cacheRaster = {};
async function rasterLogo(c) {
  if (!c.logo || !imgDe('logo')) return null;
  const dots = S.ancho === 48 ? 576 : 384;
  const clave = `${S.imgs.logo?.v}|${c.logoTam}|${dots}`;
  if (cacheRaster[clave]) return cacheRaster[clave];
  const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new Error('No se pudo leer el logo.')); i.src = imgDe('logo'); });
  const ancho = Math.max(8, Math.floor(dots * c.logoTam / 100 / 8) * 8);
  const alto = Math.max(1, Math.round(img.height * ancho / img.width));
  const cv = document.createElement('canvas');
  cv.width = ancho; cv.height = alto;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, ancho, alto);
  g.drawImage(img, 0, 0, ancho, alto);
  const px = g.getImageData(0, 0, ancho, alto).data;
  const gris = new Float32Array(ancho * alto);
  for (let i = 0; i < gris.length; i++) gris[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
  const bytesFila = ancho / 8;
  const out = new Uint8Array(8 + bytesFila * alto);
  out.set([0x1D, 0x76, 0x30, 0x00, bytesFila & 255, bytesFila >> 8, alto & 255, alto >> 8]);
  for (let y = 0; y < alto; y++) {
    for (let x = 0; x < ancho; x++) {
      const i = y * ancho + x;
      const neg = gris[i] < 128;
      const err = gris[i] - (neg ? 0 : 255);
      if (neg) out[8 + y * bytesFila + (x >> 3)] |= 0x80 >> (x & 7);
      if (x + 1 < ancho) gris[i + 1] += err * 7 / 16;
      if (y + 1 < alto) {
        if (x > 0) gris[i + ancho - 1] += err * 3 / 16;
        gris[i + ancho] += err * 5 / 16;
        if (x + 1 < ancho) gris[i + ancho + 1] += err / 16;
      }
    }
  }
  cacheRaster[clave] = out;
  return out;
}
async function bytesTicket(v, c = confTicket()) {
  const enc = new TextEncoder();
  const partes = [[0x1B, 0x40]];
  const logo = await rasterLogo(c);
  if (logo) partes.push([0x1B, 0x61, 0x01], logo, [0x0A, 0x1B, 0x61, 0x00]);
  if (c.letra === 'chica') partes.push([0x1B, 0x4D, 0x01]);
  if (c.letra === 'grande') partes.push([0x1D, 0x21, 0x01]);
  partes.push(enc.encode(lineasTicket(v, c).join('\n') + '\n\n\n\n'));
  partes.push([0x1B, 0x40], [0x1D, 0x56, 0x42, 0x00]);
  const b = new Uint8Array(partes.reduce((a, p) => a + p.length, 0));
  let o = 0;
  partes.forEach((p) => { b.set(p, o); o += p.length; });

}
function urlRawbt(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return `intent:base64,${btoa(bin)}#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;`;
}
const SERVICIOS_BT = ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455', '0000ff00-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '0000fee7-0000-1000-8000-00805f9b34fb'];
async function conectarImpresora() {
  if (!navigator.bluetooth) throw new Error('Este navegador no permite Bluetooth.');
  const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: SERVICIOS_BT });
  const srv = await dev.gatt.connect();
  const servicios = await srv.getPrimaryServices();
  let canal = null;
  for (const s of servicios) {
    for (const c of await s.getCharacteristics()) {
      if (c.properties.write || c.properties.writeWithoutResponse) { canal = c; break; }
    }
    if (canal) break;
  }
  if (!canal) { dev.gatt.disconnect(); throw new Error('Esa impresora no aceptó la conexión. Puede ser solo Bluetooth clásico, que el navegador no maneja.'); }
  dev.addEventListener('gattserverdisconnected', () => { S.bt.canal = null; if (S.vista === 'ajustes') dibujar(); });
  S.bt = { dispositivo: dev, canal };
}
async function enviarBt(bytes) {
  const c = S.bt.canal;
  const paso = 100;
  for (let i = 0; i < bytes.length; i += paso) {
    const trozo = bytes.slice(i, i + paso);
    if (c.properties.writeWithoutResponse) { await c.writeValueWithoutResponse(trozo); await new Promise((r) => setTimeout(r, 25)); }
    else await c.writeValue(trozo);
  }
}
async function imprimir(v) {
  const c = confTicket();
  if (S.metodoImp === 'rawbt') {
    S.abrirUrl(urlRawbt(await bytesTicket(v, c)));
    return;
  }
  if (S.metodoImp === 'bluetooth') {
    if (!S.bt.canal) await conectarImpresora();
    await enviarBt(await bytesTicket(v, c));
    return;
  }
  $('#ticket').innerHTML = ticketHtml(v, c);
  window.print();
}

/* Reducción de imágenes: una celda de Google Sheets guarda máximo 50 mil caracteres */
function leerImagen(file) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file);
    const i = new Image();
    i.onload = () => { URL.revokeObjectURL(url); ok(i); };
    i.onerror = () => { URL.revokeObjectURL(url); mal(new Error('Ese archivo no se pudo abrir como imagen.')); };
    i.src = url;
  });
}
function comprimir(img, anchoMax, altoMax, recortar) {
  const cv = document.createElement('canvas');
  let esc_ = recortar ? Math.max(anchoMax / img.width, altoMax / img.height) : Math.min(1, anchoMax / img.width, altoMax / img.height);
  for (let intento = 0; intento < 6; intento++) {
    const w = recortar ? Math.round(anchoMax * (1 - intento * 0.12)) : Math.max(1, Math.round(img.width * esc_));
    const h = recortar ? Math.round(altoMax * (1 - intento * 0.12)) : Math.max(1, Math.round(img.height * esc_));
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    if (recortar) {
      const k = Math.max(w / img.width, h / img.height);
      g.drawImage(img, (w - img.width * k) / 2, (h - img.height * k) / 2, img.width * k, img.height * k);
    } else g.drawImage(img, 0, 0, w, h);
    for (const q of [0.82, 0.68, 0.5]) {
      const d = cv.toDataURL('image/jpeg', q);
      if (d.length <= 45000) return d;
    }
    esc_ *= 0.8;
  }
  throw new Error('La imagen es muy pesada. Prueba con otra.');
}

    try {
      const r = await api('instalar', v);
      await entrarCon(r, v.usuario.trim().toLowerCase(), v.pin);
    } catch (e) { b.disabled = false; ponerError(f, e.message); }
  },
  async entrar(f, v) {
    const b = $('button', f); b.disabled = true;
    const usuario = v.usuario.trim().toLowerCase();
    try {
      const r = await api('entrar', { usuario, pin: v.pin });
      await entrarCon(r, usuario, v.pin);
    } catch (e) {
      b.disabled = false;
      if (!e.red) return ponerError(f, e.message);
      const l = ls.get('locales', {})[usuario];
      if (l && S.datos && (await hashLocal(v.pin, l.salt)) === l.hash) {
        S.sesion = { token: l.token, usuario: l.usuario };
        S.enLinea = false;
        ls.set('sesion', S.sesion);
        S.vista = 'vender';
        $('#raiz').innerHTML = '';
        dibujar();
        return;
      }
      ponerError(f, l ? 'Sin conexión y el PIN no coincide con el de este dispositivo.' : 'Sin conexión. Esta cuenta aún no ha entrado en este dispositivo, así que necesita internet la primera vez.');
    }
  },
  'otro-monto'(f, v) {
    const m = Number(v.monto);
    if (m < totalCarrito()) return ponerError(f.parentElement, 'El monto es menor que el total.');
    registrarVenta('efectivo', m);
  },
  mov(f, v) {
    const c = f.dataset.c; const id = f.dataset.id; const m = f.dataset.m;
    const cantidad = Number(v.cantidad);
    if (!(cantidad > 0) && m !== 'conteo') return ponerError(f, 'Escribe una cantidad mayor que cero.');
    const ahora = new Date();
    let costoUnit = Number(v.costo || 0);
    if (v.costoTotal && cantidad > 0) costoUnit = Number(v.costoTotal) / cantidad;
    const lista = c === 'producto' ? S.datos.productos : c === 'insumo' ? S.datos.insumos : S.datos.sabores;
    const it = lista.find((x) => x.id === id);
    const antes = c === 'sabor' ? it.litros : it.existencia;
    try {
      encolar({ id: uid('m_'), tipo: 'mov', dia: diaStr(ahora), hora: `${pad(ahora.getHours())}:${pad(ahora.getMinutes())}`, ts: ahora.toISOString(), clase: c, itemId: id, accion: m, cantidad, costoUnit, nota: v.nota || '' });
    } catch (e) { return ponerError(f, e.message); }
    cerrarDlg();
    dibujar();
    if (m === 'conteo') {
      const dif = Math.round((cantidad - antes) * 100) / 100;
      aviso(dif === 0 ? 'Coincide con el sistema.' : dif < 0 ? `Faltaron ${dec(-dif)} contra el sistema.` : `Sobraron ${dec(dif)} contra el sistema.`, null, null, 6000);
    } else aviso('Guardado');
  },
  async producto(f, v) {
    const consumos = $$('.cons', f).map((r) => ({ i: $('select', r).value, c: Number($('input', r).value) })).filter((c) => c.i && c.c > 0);
    const b = $('button:not([type=button])', f);
    const foto = S.fotoNueva;
    b.disabled = true;
    try {
      const r = await api('guardarProducto', { datos: {
        id: f.dataset.id || undefined, nombre: v.nombre, categoria: v.categoria, tipo: v.tipo, precio: Number(v.precio), costo: Number(v.costo || 0),
        existencia: Number(v.existencia || 0), minimo: Number(v.minimo || 0), color: v.color, saborId: v.saborId, ml: Number(v.ml || 0), consumos,
        activo: f.dataset.id ? v.activo === 'on' : true
      } });
      let datos = r.datos;
      if (foto !== undefined) {
        const r2 = await api('guardarImagen', { id: r.id, data: foto });
        datos = r2.datos;
        if (foto) S.imgs[r.id] = { v: datos.imagenes[r.id], d: foto }; else delete S.imgs[r.id];
        ls.set('imgs', S.imgs);
      }
      guardarDatos(datos);
      cerrarDlg();
      dibujar();
      aviso('Producto guardado');
    } catch (e) {
      ponerError(f, e.red ? 'Esto necesita internet. Revisa la conexión e intenta de nuevo.' : e.message);
      b.disabled = false;
    }
  },
  insumo(f, v) {
    enviarCatalogo('guardarInsumo', { id: f.dataset.id || undefined, nombre: v.nombre, unidad: v.unidad, costo: Number(v.costo || 0), existencia: Number(v.existencia || 0), minimo: Number(v.minimo || 0), activo: f.dataset.id ? v.activo === 'on' : true }, f, 'Insumo guardado');
  },
  sabor(f, v) {
    enviarCatalogo('guardarSabor', { id: f.dataset.id || undefined, nombre: v.nombre, color: v.color, costoLitro: Number(v.costoLitro || 0), minimo: Number(v.minimo || 0), activo: f.dataset.id ? v.activo === 'on' : true }, f, 'Sabor guardado');
  },
  usuario(f, v) {
    enviarCatalogo('guardarUsuario', { id: f.dataset.id || undefined, nombre: v.nombre, usuario: v.usuario, rol: v.rol, pin: v.pin, turnoId: v.turnoId, asistencia: v.asistencia === 'on', activo: f.dataset.id ? v.activo === 'on' : true }, f, 'Cuenta guardada');
  },
  ciclo(f, v) {
    enviarCatalogo('guardarCicloVacaciones', { id: f.dataset.id || undefined, empleadoId: f.dataset.u, inicio: v.inicio, dias: Number(v.dias || 0), previos: Number(v.previos || 0), sumarSobrantes: f.elements.sumar ? v.sumar === 'on' : true }, f, 'Periodo guardado');
  },
  vacacion(f, v) {
    enviarCatalogo('guardarVacacion', { id: f.dataset.id || undefined, empleadoId: f.dataset.u, desde: v.desde, hasta: v.hasta, dias: Number(v.dias), nota: v.nota }, f, 'Vacaciones guardadas');
  },
  ticket(f) { enviarCatalogo('guardarConfig', { ticket: leerFormTicket() }, f, 'Ticket guardado'); },
  caja(f, v) { enviarCatalogo('guardarConfig', { negocio: v.negocio, formatoVenta: v.formatoVenta }, f, 'Guardado'); },
  tolerancia(f, v) { enviarCatalogo('guardarConfig', { tolerancia: Number(v.tolerancia || 0) }, f, 'Tolerancia guardada'); },
  turno(f, v) {
    const dias = $$('input[name=dia]:checked', f).map((x) => Number(x.value));
    enviarCatalogo('guardarTurno', { id: f.dataset.id || undefined, nombre: v.nombre, entrada: v.entrada, salida: v.salida, dias, activo: f.dataset.id ? v.activo === 'on' : true }, f, 'Turno guardado');
  },
  async asistencia(f, v) {
    const b = $('button:not([type=button])', f); b.disabled = true;
    try {
      const r = await api('corregirAsistencia', { datos: { id: f.dataset.id || undefined, empleadoId: f.dataset.u, dia: f.dataset.d, entrada: v.entrada, salida: v.salida, nota: v.nota } });
      guardarDatos(r.datos);
      cerrarDlg();
      if (S.rep.datos) S.rep.datos.fresco = 0;
      dibujar();
      aviso('Registro guardado');
    } catch (e) { b.disabled = false; ponerError(f, e.red ? 'Esto necesita internet.' : e.message); }
  },
  async pin(f, v) {
    const b = $('button:not([type=button])', f); b.disabled = true;
    try {
      await api('cambiarPin', v);
      await recordarLocal(S.sesion.usuario.usuario, v.pinNuevo, S.sesion.token, S.sesion.usuario);
      cerrarDlg();
      aviso('PIN cambiado');
    } catch (e) { b.disabled = false; ponerError(f, e.red ? 'Esto necesita internet.' : e.message); }
  },
  async cancelar(f, v) {
    const b = $('button:not([type=button])', f); b.disabled = true;
    try {
      const r = await api('cancelarVenta', { id: f.dataset.id, motivo: v.motivo });
      guardarDatos(r.datos);
      if (S.rep.datos) S.rep.datos.fresco = 0;
      aviso('Venta cancelada');
      dialogoVentasDia();
    } catch (e) { b.disabled = false; ponerError(f, e.red ? 'Cancelar necesita internet.' : e.message); }
  }
};
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-f]');
  if (!f) return;
  e.preventDefault();
  const fn = F[f.dataset.f];
  if (fn) fn(f, Object.fromEntries(new FormData(f)));
});

/* ========== Arranque ========== */
window.addEventListener('online', () => { S.enLinea = true; refrescarEstado(); sincronizar(); });
window.addEventListener('offline', () => { S.enLinea = false; refrescarEstado(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(); });
setInterval(sincronizar, 60000);
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.instalar = e; });
if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost') {
  if (!window.__SIN_SW) navigator.serviceWorker?.register('sw.js').catch((e) => anotarError('Modo sin conexión no disponible: ' + e.message));
}
if (S.sesion && !S.datos) { S.sesion = null; ls.del('sesion'); }
dibujar();
if (S.sesion) sincronizar();
</script>
</body>
</html>
